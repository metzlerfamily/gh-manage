name: policy

# Approval check for config PRs, published as the commit status
# `gh-manage/approvals` (make it required on main).
#
# Security: every trigger runs this file and the checked-out code from the
# default branch. The PR's YAML is fetched into a separate ref and read as
# data, never executed, so a request cannot change the rules that judge it.
# The PR number from the review relay is validated as an integer and all other
# facts (author, head sha, reviews) are re-read from the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_run:
    workflows: [policy-review-trigger]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: read

jobs:
  approvals:
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FROM_PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then n="$FROM_PR"; else
            gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n pr-number -D "$RUNNER_TEMP/relay"
            n="$(head -c 12 "$RUNNER_TEMP/relay/pr-number")"
          fi
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::invalid PR number"; exit 1; }
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Evaluate approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: npm run --silent ghm -- check-pr
