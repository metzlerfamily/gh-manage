name: reconcile

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["config/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, never write
        type: boolean
        default: false
      only:
        description: Restrict to one app key, e.g. ghm-demo-bot
        type: string
        default: ""
      override_guard:
        description: Bypass the removal circuit breaker
        type: boolean
        default: false

concurrency:
  group: reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: apps
        env:
          ONLY: ${{ inputs.only }}
        run: echo "apps=$(npm run --silent ghm -- managed-apps)" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: enforce
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reconcile ${{ matrix.app.key }}
        env:
          GHM_ADMIN_TOKEN: ${{ secrets.GHM_ADMIN_TOKEN }}
          GHM_APP_PRIVATE_KEY: ${{ secrets[matrix.app.secret] }}
          APP: ${{ matrix.app.key }}
          DRY_RUN: ${{ inputs.dry_run }}
          OVERRIDE_GUARD: ${{ inputs.override_guard }}
        run: |
          args=(--app "$APP" --out "status-$APP.json")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ "$OVERRIDE_GUARD" = true ] && args+=(--override-guard)
          npm run --silent ghm -- reconcile "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-${{ matrix.app.key }}
          path: status-${{ matrix.app.key }}.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [plan, reconcile]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: status-*
          merge-multiple: true
          path: ${{ runner.temp }}/parts
      - name: Publish status.json to the status branch
        env:
          PARTS: ${{ runner.temp }}/parts
        run: |
          shopt -s nullglob
          files=("$PARTS"/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo '{"generated_at":"'"$(date -u +%FT%TZ)"'","dry_run":false,"results":[]}' > "$RUNNER_TEMP/status.json"
          else
            jq -s '{generated_at: (map(.generated_at) | max), dry_run: (map(.dry_run) | any), results: (map(.results) | add | sort_by(.app, .org))}' "${files[@]}" > "$RUNNER_TEMP/status.json"
          fi
          if git fetch -q origin status 2>/dev/null && \
             [ "$(git show FETCH_HEAD:status.json | jq -S .results)" = "$(jq -S .results "$RUNNER_TEMP/status.json")" ]; then
            echo "status unchanged"; exit 0
          fi
          git checkout -q --orphan status-new
          git rm -rfq --cached .
          cp "$RUNNER_TEMP/status.json" status.json
          git add status.json
          git -c user.name=gh-manage -c user.email=gh-manage@users.noreply.github.com commit -qm "status $(date -u +%FT%TZ)"
          git push -qf origin status-new:status
