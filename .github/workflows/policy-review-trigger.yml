name: policy-review-trigger

# Unprivileged relay: reviews must re-run the approval check, but a
# pull_request_review workflow runs the PR's own copy of this file. It only
# records the PR number; `policy` re-runs from the default branch via
# workflow_run and re-derives everything else from the API.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.pull_request.number }}" > pr-number
      - uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number
          retention-days: 1
